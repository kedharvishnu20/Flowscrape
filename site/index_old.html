<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verquill Registry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <style>
      /*
       * The extension is designed like the front panel of a piece of lab
       * equipment. This is the parts catalogue that goes with it.
       *
       * Same warm graphite, same single amber signal, same two faces — but a
       * catalogue has room a 400px strip does not, so the density goes
       * sideways into tabular rows rather than down into accordions. Every
       * entry carries a part number and a picture of its own structure.
       *
       * Deliberately single-theme. The instrument is dark; a catalogue for it
       * that turned white in daylight would be a different product. Every
       * colour is painted explicitly so the page holds on any host ground.
       */
      :root {
        --void: #0a0908;
        --base: #121110;
        --raised: #1a1917;
        --hover: #232120;
        --line: #2e2b28;
        --hair: rgba(242, 239, 233, 0.08);

        --ink: #f2efe9;
        --muted: #a09a90;
        --dim: #6f6a63;

        /* The one colour anything actionable is allowed to be. */
        --amber: #e8b33a;
        --amber-ink: #100e0a;
        --amber-dim: rgba(232, 179, 58, 0.14);

        /* Reserved. Mint means checked-and-passed, and nothing else. */
        --mint: #5fe3c0;
        --mint-dim: rgba(95, 227, 192, 0.12);

        /* Semantic, kept apart from the accent. */
        --red: #ff5c3a;
        --red-dim: rgba(255, 92, 58, 0.13);
        --green: #7fc98a;

        /* Step categories, straight from the extension's palette. */
        --cat-action: #e0a03f;
        --cat-flow: #9b8bd4;
        --cat-data: #6fa8c9;

        --mono:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;

        --gutter: clamp(16px, 4vw, 56px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        background: var(--base);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* Grain. Instruments are not printed on glossy stock. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.028;
        background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='140' height='140' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      :focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ── Shell ──────────────────────────────────────────────────────────── */

      .masthead {
        border-bottom: 1px solid var(--line);
        background: var(--void);
        position: sticky;
        top: 0;
        z-index: 50;
      }

      .masthead-in {
        max-width: 1320px;
        margin: 0 auto;
        padding: 0 var(--gutter);
        display: flex;
        align-items: center;
        gap: 28px;
        height: 62px;
      }

      .wordmark {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.02em;
        display: flex;
        align-items: baseline;
        gap: 8px;
        white-space: nowrap;
      }

      .wordmark b {
        color: var(--amber);
        font-weight: 700;
      }

      .wordmark span {
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 500;
      }

      .mainnav {
        display: flex;
        gap: 2px;
        margin-left: auto;
        flex-wrap: wrap;
      }

      .mainnav a {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 7px 13px;
        border: 1px solid transparent;
        transition:
          color 0.14s,
          border-color 0.14s;
      }

      .mainnav a:hover {
        color: var(--ink);
        border-color: var(--line);
      }

      .mainnav a.on {
        color: var(--amber-ink);
        background: var(--amber);
        border-color: var(--amber);
      }

      main {
        max-width: 1320px;
        margin: 0 auto;
        padding: 0 var(--gutter) 96px;
      }

      /* ── Section furniture ──────────────────────────────────────────────── */

      .head {
        padding: 44px 0 26px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 26px;
      }

      .eyebrow {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--dim);
        margin-bottom: 14px;
      }

      h1 {
        font-family: var(--mono);
        font-size: clamp(28px, 4.4vw, 46px);
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.02;
        text-wrap: balance;
      }

      h1 em {
        font-style: normal;
        color: var(--amber);
      }

      .lede {
        margin-top: 16px;
        max-width: 64ch;
        color: var(--muted);
        font-size: 15.5px;
      }

      .lede strong {
        color: var(--ink);
        font-weight: 500;
      }

      h2 {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 4px;
      }

      /* ── Controls ───────────────────────────────────────────────────────── */

      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }

      .field {
        font-family: var(--mono);
        font-size: 12.5px;
        background: var(--void);
        color: var(--ink);
        border: 1px solid var(--line);
        padding: 9px 12px;
      }

      .field::placeholder {
        color: var(--dim);
      }

      .field:focus {
        border-color: var(--amber);
        outline: none;
      }

      #q {
        flex: 1;
        min-width: 210px;
      }

      .chipset {
        display: flex;
        gap: 2px;
        flex-wrap: wrap;
      }

      .chip {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        padding: 7px 11px;
        cursor: pointer;
        transition:
          color 0.14s,
          border-color 0.14s;
      }

      .chip:hover {
        color: var(--ink);
        border-color: var(--dim);
      }

      .chip.on {
        color: var(--amber);
        border-color: var(--amber);
        background: var(--amber-dim);
      }

      .btn {
        font-family: var(--mono);
        font-size: 11.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 500;
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        padding: 10px 16px;
        cursor: pointer;
        transition:
          background 0.14s,
          border-color 0.14s;
      }

      .btn:hover {
        border-color: var(--dim);
        background: var(--hover);
      }

      .btn-primary {
        background: var(--amber);
        color: var(--amber-ink);
        border-color: var(--amber);
        font-weight: 700;
      }

      .btn-primary:hover {
        background: #f2c256;
        border-color: #f2c256;
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ── The catalogue ──────────────────────────────────────────────────── */

      .rows {
        border-top: 1px solid var(--line);
      }

      /* Column legend. A catalogue names its columns; the shape column in
         particular means nothing until you are told what it draws. */
      .rows-head {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr) 190px 128px;
        gap: 20px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .rows-head > :last-child {
        text-align: right;
      }

      /* The header already draws the rule; two would read as a mistake. */
      .rows-head + .rows {
        border-top: 0;
      }

      .legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        align-items: center;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--dim);
        margin-bottom: 14px;
      }

      .legend i {
        display: inline-block;
        width: 16px;
        height: 8px;
        margin-right: 6px;
        vertical-align: -1px;
      }

      @media (max-width: 900px) {
        .rows-head {
          display: none;
        }
      }

      .row {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr) 190px 128px;
        gap: 20px;
        align-items: center;
        padding: 17px 12px;
        border-bottom: 1px solid var(--hair);
        cursor: pointer;
        transition: background 0.13s;
        width: 100%;
        text-align: left;
        background: transparent;
        border-left: 0;
        border-right: 0;
        border-top: 0;
        color: inherit;
        font: inherit;
      }

      .row:hover {
        background: var(--raised);
      }

      .partno {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--dim);
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
      }

      .row:hover .partno {
        color: var(--amber);
      }

      .row-name {
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
      }

      .row-meta {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .row-num {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--muted);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .row-num span {
        display: block;
        font-size: 9.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
        margin-top: 2px;
      }

      /*
       * The signature element: a pipeline's own structure, drawn.
       *
       * One segment per step, coloured by category, nested segments inset for
       * loops and branches. It is the extension's idea — the shape of a
       * pipeline should be legible before a single label is read — carried
       * onto a listing page, where it does something a screenshot cannot:
       * tells you at a glance that this one paginates and that one does not.
       */
      .shape {
        display: flex;
        gap: 2px;
        height: 22px;
        align-items: stretch;
      }

      .seg {
        flex: 1;
        min-width: 3px;
        position: relative;
        border-radius: 0;
      }

      .seg-action {
        background: var(--cat-action);
      }
      .seg-flow {
        background: var(--cat-flow);
      }
      .seg-data {
        background: var(--cat-data);
      }

      .seg-nested {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 2.2;
        background: transparent;
      }

      .seg-nested > .seg-bar {
        height: 6px;
        background: var(--cat-flow);
      }

      .seg-nested > .seg-kids {
        display: flex;
        gap: 2px;
        flex: 1;
        padding-left: 9px;
        border-left: 1px solid var(--cat-flow);
      }

      /* ── Badges ─────────────────────────────────────────────────────────── */

      .badge {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 3px 7px;
        border: 1px solid;
        white-space: nowrap;
        font-weight: 500;
      }

      .b-verified {
        color: var(--mint);
        border-color: rgba(95, 227, 192, 0.4);
        background: var(--mint-dim);
      }

      .b-review {
        color: var(--amber);
        border-color: rgba(232, 179, 58, 0.4);
        background: var(--amber-dim);
      }

      .b-refused {
        color: var(--red);
        border-color: rgba(255, 92, 58, 0.45);
        background: var(--red-dim);
      }

      .b-broken {
        color: var(--red);
        border-color: rgba(255, 92, 58, 0.35);
        background: transparent;
      }

      .b-plain {
        color: var(--dim);
        border-color: var(--line);
      }

      /* ── Detail view ────────────────────────────────────────────────────── */

      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 372px;
        gap: 40px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        background: var(--raised);
      }

      .panel-head {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--void);
      }

      .panel-body {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .kv {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-family: var(--mono);
        font-size: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--hair);
      }

      .kv:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .kv dt {
        color: var(--dim);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 10px;
        padding-top: 2px;
      }

      .kv dd {
        color: var(--ink);
        text-align: right;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }

      /* The step list, drawn like the panel draws it. */
      .steps {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .step {
        display: grid;
        grid-template-columns: 26px 3px 1fr;
        gap: 12px;
        align-items: center;
        background: var(--raised);
        border: 1px solid var(--line);
        padding: 11px 13px;
      }

      .step-idx {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }

      .step-bar {
        align-self: stretch;
        background: var(--stepc, var(--cat-data));
      }

      .step-name {
        font-family: var(--mono);
        font-size: 12.5px;
        font-weight: 500;
      }

      .step-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
        overflow-wrap: anywhere;
      }

      .step-kids {
        margin-left: 22px;
        padding-left: 14px;
        border-left: 1px solid var(--cat-flow);
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-top: 3px;
      }

      /* ── Capability review ──────────────────────────────────────────────── */

      .verdict {
        border: 1px solid;
        padding: 15px 16px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .verdict-allow {
        border-color: rgba(127, 201, 138, 0.4);
        background: rgba(127, 201, 138, 0.08);
      }
      .verdict-review {
        border-color: rgba(232, 179, 58, 0.4);
        background: var(--amber-dim);
      }
      .verdict-blocked {
        border-color: rgba(255, 92, 58, 0.5);
        background: var(--red-dim);
      }

      .verdict-title {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .verdict-allow .verdict-title {
        color: var(--green);
      }
      .verdict-review .verdict-title {
        color: var(--amber);
      }
      .verdict-blocked .verdict-title {
        color: var(--red);
      }

      .verdict p {
        font-size: 13.5px;
        color: var(--ink);
        line-height: 1.55;
      }

      .caps {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .cap {
        display: grid;
        grid-template-columns: 3px 1fr;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--hair);
      }

      .cap:last-child {
        border-bottom: 0;
      }

      .cap-rule {
        background: var(--dim);
      }
      .cap-danger .cap-rule {
        background: var(--red);
      }
      .cap-notice .cap-rule {
        background: var(--amber);
      }
      .cap-info .cap-rule {
        background: var(--dim);
      }

      .cap-title {
        font-family: var(--mono);
        font-size: 12.5px;
        font-weight: 500;
      }

      .cap-danger .cap-title {
        color: var(--red);
      }

      .cap-detail {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 3px;
        line-height: 1.5;
      }

      /* ── Code ───────────────────────────────────────────────────────────── */

      pre,
      textarea.code {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.65;
        background: var(--void);
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 14px;
        overflow-x: auto;
        white-space: pre;
        tab-size: 2;
      }

      textarea.code {
        width: 100%;
        min-height: 300px;
        resize: vertical;
        white-space: pre;
      }

      textarea.code:focus {
        border-color: var(--amber);
        outline: none;
      }

      /* ── Forum ──────────────────────────────────────────────────────────── */

      .thread {
        display: grid;
        grid-template-columns: 118px minmax(0, 1fr) 92px;
        gap: 20px;
        align-items: start;
        padding: 17px 12px;
        border-bottom: 1px solid var(--hair);
        cursor: pointer;
        width: 100%;
        text-align: left;
        background: transparent;
        border-left: 0;
        border-right: 0;
        border-top: 0;
        color: inherit;
        font: inherit;
        transition: background 0.13s;
      }

      .thread:hover {
        background: var(--raised);
      }

      .thread-cat {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--dim);
        border-left: 2px solid var(--line);
        padding-left: 9px;
        padding-top: 2px;
      }

      .thread-cat.c-report {
        border-left-color: var(--red);
        color: var(--red);
      }
      .thread-cat.c-help {
        border-left-color: var(--cat-flow);
        color: var(--cat-flow);
      }
      .thread-cat.c-show {
        border-left-color: var(--mint);
        color: var(--mint);
      }

      .thread-title {
        font-family: var(--mono);
        font-size: 13.5px;
        font-weight: 500;
        letter-spacing: -0.01em;
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
      }

      .thread-meta {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 5px;
      }

      .thread-count {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--muted);
        text-align: right;
        font-variant-numeric: tabular-nums;
        padding-top: 1px;
      }

      .thread-count span {
        display: block;
        font-size: 9.5px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .post {
        border: 1px solid var(--line);
        background: var(--raised);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .post-by {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--muted);
        padding-bottom: 11px;
        border-bottom: 1px solid var(--hair);
        flex-wrap: wrap;
      }

      .post-by b {
        color: var(--ink);
        font-weight: 500;
      }

      .post-body p {
        margin-bottom: 11px;
        max-width: 68ch;
      }

      .post-body p:last-child {
        margin-bottom: 0;
      }

      .post-body code {
        font-family: var(--mono);
        font-size: 12.5px;
        background: var(--void);
        border: 1px solid var(--line);
        padding: 1px 5px;
        color: var(--amber);
      }

      .answer {
        border-color: rgba(95, 227, 192, 0.35);
      }

      .answer .post-by::after {
        content: "ANSWERED";
        font-size: 9.5px;
        letter-spacing: 0.13em;
        color: var(--mint);
        border: 1px solid rgba(95, 227, 192, 0.4);
        padding: 2px 6px;
        margin-left: auto;
      }

      /* ── Utility ────────────────────────────────────────────────────────── */

      .stack {
        display: flex;
        flex-direction: column;
        gap: 26px;
      }

      .stack-sm {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .rowflex {
        display: flex;
        gap: 10px;

      <span>Verquill Registry · pipelines are reviewed, not trusted</span>
      <span>MIT · no account · no tracking</span>

    <script>
      // ────────────────────────────────────────────────────────────────────────
      // The capability analyser, the same rules the extension applies on import.
      //
      // It lives here as well as in utils/pipeline-capabilities.js on purpose:
      // the registry must be able to refuse a submission before it is ever
      // listed, and a check that only runs after download protects nobody who
      // was browsing. The extension re-runs it regardless — this is a filter on
      // the catalogue, not a substitute for the gate on the door.
      // ────────────────────────────────────────────────────────────────────────

      const SEVERITY = { INFO: "info", NOTICE: "notice", DANGER: "danger" };
      const VERDICT = { ALLOW: "allow", REVIEW: "review", BLOCKED: "blocked" };

      const AUTH_HEADERS = [
        "authorization",
        "cookie",
        "x-api-key",
        "x-auth-token",
        "authentication",
        "proxy-authorization",
      ];
      const TEMPLATED = /\{\{|\$\{/;

      function originOf(url) {
        if (typeof url !== "string" || !url.trim()) return { unknown: true };
        const t = url.trim();
        if (TEMPLATED.test(t.split("/").slice(0, 3).join("/")))
          return { unknown: true };
        try {
          const u = new URL(t);
          if (!/^https?:$/.test(u.protocol)) return { unknown: true };
          return { origin: u.origin };
        } catch {
          return { unknown: true };
        }
      }

      function walkSteps(steps, out = []) {
        for (const s of Array.isArray(steps) ? steps : []) {
          if (!s || typeof s !== "object") continue;
          out.push(s);
          walkSteps(s.children, out);
          walkSteps(s.ifBranch, out);
          walkSteps(s.elseBranch, out);
        }
        return out;
      }

      function headerNames(step) {
        const raw = step?.config?.headers;
        if (typeof raw !== "string" || !raw.trim()) return [];
        try {
          const p = JSON.parse(raw);
          if (p && typeof p === "object") return Object.keys(p);
        } catch {
          /* line form */
        }
        return raw
          .split("\n")
          .map((l) => l.split(":")[0]?.trim())
          .filter(Boolean);
      }

      function analyzePipeline(pipeline) {
        const steps = walkSteps(pipeline?.steps);
        const caps = [];
        const add = (c) => {
          const e = caps.find((x) => x.id === c.id);
          if (e) {
            e.steps.push(...c.steps);
            return;
          }
          caps.push(c);
        };

        const declared = new Set();
        const t = originOf(pipeline?.targetOrigin);
        if (t.origin) declared.add(t.origin);
        for (const s of steps) {
          if (s.type === "WEBSITE" || s.type === "NAVIGATE") {
            const o = originOf(s.config?.url);
            if (o.origin) declared.add(o.origin);
          }
        }

        const thirdParty = new Set();
        let creds = false;
        let authHeaders = false;

        for (const s of steps) {
          const id = s.id || s.type;
          if (s.type === "SESSION") {
            const ck = s.config?.includeCookies !== false;
            if (ck || s.config?.includeStorage !== false) creds = true;
            add({
              id: "credentials",
              severity: SEVERITY.DANGER,
              title: ck
                ? "Reads and restores your logged-in session"
                : "Reads the page's stored data",
              detail:
                "Handles the cookies that keep you signed in. Legitimate for a pipeline that scrapes behind a login — and the exact thing a malicious one wants.",
              steps: [id],
            });
          } else if (s.type === "SET_HEADERS") {
            const names = headerNames(s);
            const auth = names.filter((n) =>
              AUTH_HEADERS.includes(n.toLowerCase()),
            );
            if (auth.length) authHeaders = true;
            add({
              id: "headers",
              severity: auth.length ? SEVERITY.DANGER : SEVERITY.NOTICE,
              title: auth.length
                ? "Attaches credentials to requests (" + auth.join(", ") + ")"
                : "Sets custom request headers",
              detail: names.length
                ? "Headers set: " + names.join(", ") + "."
                : "No headers configured.",
              steps: [id],
            });
          } else if (s.type === "API" || s.type === "DOWNLOAD_FILE") {
            const url = s.config?.url;
            if (s.type === "DOWNLOAD_FILE" && !url) continue;
            const { origin, unknown } = originOf(url);
            const off = unknown || !declared.has(origin);
            if (off) thirdParty.add(unknown ? "(decided at run time)" : origin);
            add({
              id: "network",
              severity: off ? SEVERITY.DANGER : SEVERITY.NOTICE,
              title: off
                ? "Sends requests to a site outside the one it scrapes"
                : "Calls an API on the site it scrapes",
              detail:
                "Destination: " +
                (unknown ? "chosen at run time from page data" : origin) +
                ".",
              steps: [id],
            });
          } else if (s.type === "UPLOAD_ACTIVITY") {
            add({
              id: "upload",
              severity: SEVERITY.DANGER,
              title: "Uploads files from your storage library",
              detail:
                "Sends files you added to the extension's library into a page's upload control.",
              steps: [id],
            });
          } else if (s.type === "AUTO_EXTRACT") {
            add({
              id: "ai",
              severity: SEVERITY.NOTICE,
              title: "Sends page text to whichever model you configured",
              detail:
                "Only if you configured a provider. A local model sends nothing off your machine.",
              steps: [id],
            });
          } else if (s.type === "SOLVE_CAPTCHA") {
            add({
              id: "captcha",
              severity: SEVERITY.DANGER,
              title: "Attempts to answer a captcha",
              detail:
                "Still needs your per-run authorisation and a per-domain attestation. Installing this grants neither.",
              steps: [id],
            });
          } else if (s.type === "EXPORT") {
            add({
              id: "export",
              severity: SEVERITY.INFO,
              title: "Writes the collected rows to a file",
              detail: "Through Chrome's normal download flow.",
              steps: [id],
            });
          }
        }

        let verdict = caps.length ? VERDICT.REVIEW : VERDICT.ALLOW;
        let blockedReason = null;
        if ((creds || authHeaders) && thirdParty.size) {
          verdict = VERDICT.BLOCKED;
          blockedReason =
            "This pipeline reads " +
            (creds ? "your logged-in session" : "credentials") +
            " and also sends requests to " +
            [...thirdParty].join(", ") +
            ", which is not a site it says it scrapes. That combination is how a shared pipeline steals an account, and no legitimate scraper needs it.";
        }
        if (
          verdict === VERDICT.REVIEW &&
          caps.every((c) => c.severity === SEVERITY.INFO)
        )
          verdict = VERDICT.ALLOW;

        return {
          verdict,
          capabilities: caps,
          declaredOrigins: [...declared],
          thirdPartyOrigins: [...thirdParty],
          blockedReason,
        };
      }

      // ────────────────────────────────────────────────────────────────────────
      // Step registry — category and human name, mirroring utils/step-types.js.
      // The extension's own card shows the raw enum; a catalogue has no excuse.
      // ────────────────────────────────────────────────────────────────────────

      const STEPS = {
        WEBSITE: ["Action", "Open website"],
        NAVIGATE: ["Action", "Go to URL"],
        CLICK: ["Action", "Click element"],
        FILL: ["Action", "Fill a field"],

        KEYBOARD: ["Action", "Press keys"],

        LOOP: ["Flow", "Loop"],

        SOLVE_CAPTCHA: ["Flow", "Answer a challenge"],
        ASSERT: ["Flow", "Check the page still looks right"],
        DEDUPE: ["Flow", "Drop rows already seen"],
        SET_HEADERS: ["Flow", "Send request headers"],
        SESSION: ["Flow", "Save or restore a session"],
        EXTRACT: ["Data", "Extract data"],
        AUTO_EXTRACT: ["Data", "Extract with AI"],

        DOWNLOAD_FILE: ["Data", "Download matched files"],
        EXPORT: ["Data", "Export results"],
        SCREENSHOT: ["Data", "Screenshot"],
      };

      const catOf = (t) => (STEPS[t] || ["Data"])[0];
      const nameOf = (t) => (STEPS[t] || [null, t])[1];
      const catClass = (t) => "seg-" + catOf(t).toLowerCase();

      // ────────────────────────────────────────────────────────────────────────
      // Catalogue data. Real pipeline JSON, not placeholders — every entry here
      // is run through the same analyser the page offers to visitors, so the
      // badges are computed rather than typed.
      // ────────────────────────────────────────────────────────────────────────

        Object.assign(
          {
            id,

            author,
            site,

      const THREADS = [

              by: "marco-f",
              when: "4 days ago",
              body: "<p>Trying to keep everything on my own machine. Has anyone compared local models for AUTO_EXTRACT specifically? Interested in what actually returns usable JSON rather than what benchmarks well.</p>",
            },
            {
              by: "sable",
              when: "4 days ago",
              body: "<p>Anything 7B and up with real structured-output support has been fine for me. The thing that matters more than the model is that grounding is on: every value gets checked against the page text before it is kept, so a weaker model fails by dropping fields rather than by inventing them. That makes a mediocre local model <em>safe</em>, which is not the same as good, but it is the property you want.</p>",
            },
          ],
        },
        {
          id: "t-384",
          cat: "Site report",
          catClass: "c-report",
          title: "market.example.com added a challenge wall on page 3",
          by: "deals-watch",
          when: "1 week ago",
          replies: 4,
          affects: null,
          solved: false,
          posts: [
            {
              by: "deals-watch",
              when: "1 week ago",
              body: "<p>Paginating past page 2 now lands on a challenge page. Flagging it rather than working around it — if a site has put a wall up, that is them asking not to be scraped at volume, and the honest answer is to stop rather than to route around it.</p>",
            },
            {
              by: "mira-tan",
              when: "6 days ago",
              body: "<p>Agreed, and worth saying plainly: SOLVE_CAPTCHA exists for sites you own and it asks you to attest to that per domain. It is not the answer here.</p>",
            },
          ],
        },
      ];

      // ────────────────────────────────────────────────────────────────────────
      // Rendering
      // ────────────────────────────────────────────────────────────────────────

      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      const view = document.getElementById("view");
      const num = (n) => n.toLocaleString("en-US");

      /** Draw a pipeline's structure: one segment per step, nested for loops. */
      function shapeOf(steps, depth = 0) {
        return (steps || [])
          .map((s) => {
            const kids = s.children || s.ifBranch || [];
            if (kids.length && depth < 2) {
              return (
                '<div class="seg seg-nested"><div class="seg-bar"></div>' +
                '<div class="seg-kids">' +
                shapeOf(kids, depth + 1) +
                "</div></div>"
              );
            }
            return '<div class="seg ' + catClass(s.type) + '"></div>';
          })
          .join("");
      }

      function badgeFor(p) {
        if (p.analysis.verdict === VERDICT.BLOCKED)
          return '<span class="badge b-refused">Refused</span>';
        if (p.broken) return '<span class="badge b-broken">Broken</span>';
        if (p.analysis.verdict === VERDICT.REVIEW)
          return '<span class="badge b-review">Review</span>';
        if (p.verified) return '<span class="badge b-verified">Verified</span>';
        return "";
      }

      function countSteps(steps) {
        return walkSteps(steps).length;
      }

      // ── Registry ────────────────────────────────────────────────────────────

      let filter = { q: "", tag: "all" };

      function renderRegistry() {
        const tags = [
          "all",
          "starter",
          "ecommerce",
          "ai",
          "monitoring",
          "login",
          "refused",
        ];
        const q = filter.q.toLowerCase();

        const list = REGISTRY.filter((p) => {
          if (filter.tag !== "all" && !(p.tags || []).includes(filter.tag))
            return false;
          if (!q) return true;
          return (
            p.name.toLowerCase().includes(q) ||
            p.id.toLowerCase().includes(q) ||
            p.author.toLowerCase().includes(q) ||
            (p.desc || "").toLowerCase().includes(q)
          );
        });

        const installs = REGISTRY.reduce((n, p) => n + p.installs, 0);
        const refused = REGISTRY.filter(
          (p) => p.analysis.verdict === VERDICT.BLOCKED,
        ).length;

        view.innerHTML =
          '<div class="head">' +
          '<div class="eyebrow">Community pipelines</div>' +
          "<h1>Someone already wrote<br />the <em>pipeline</em> you need.</h1>" +
          '<p class="lede">Paste a pipeline in, take one out. Every entry is read by the ' +
          "same capability check the extension runs on import — so you can see what " +
          "a pipeline is able to do to you <strong>before</strong> you install it, not after.</p>" +
          '<div class="stats">' +
          '<div class="stat"><b>' +
          REGISTRY.length +
          "</b><span>Listed</span></div>" +
          '<div class="stat"><b>' +
          num(installs) +
          "</b><span>Installs</span></div>" +
          '<div class="stat"><b style="color:var(--red)">' +
          refused +
          "</b><span>Refused</span></div>" +
          '<div class="stat"><b>' +
          THREADS.length +
          "</b><span>Open threads</span></div>" +
          "</div></div>" +
          '<div class="toolbar">' +
          '<input class="field" id="q" placeholder="Search name, author or part number" value="' +
          esc(filter.q) +
          '" />' +
          '<div class="chipset">' +
          tags
            .map(
              (t) =>
                '<button class="chip' +
                (filter.tag === t ? " on" : "") +
                '" data-tag="' +
                t +
                '">' +
                t +
                "</button>",
            )
            .join("") +
          "</div></div>" +
          '<div class="legend">' +
          "<span>Shape reads left to right —</span>" +
          '<span><i style="background:var(--cat-action)"></i>Acts on the page</span>' +
          '<span><i style="background:var(--cat-flow)"></i>Controls the flow</span>' +
          '<span><i style="background:var(--cat-data)"></i>Handles data</span>' +
          "<span>Indented = inside a loop</span>" +
          "</div>" +
          '<div class="rows-head">' +
          "<div>Part</div><div>Pipeline</div><div>Shape</div><div>Installs</div>" +
          "</div>" +
          '<div class="rows">' +
          (list.length
            ? list
                .map(
                  (p) =>
                    '<button class="row" data-id="' +
                    p.id +
                    '">' +
                    '<div class="partno">' +
                    p.id +
                    "</div>" +
                    "<div>" +
                    '<div class="row-name">' +
                    esc(p.name) +
                    badgeFor(p) +
                    "</div>" +
                    '<div class="row-meta">' +
                    esc(p.desc) +
                    "</div></div>" +
                    '<div class="shape" title="' +
                    countSteps(p.steps) +
                    ' steps">' +
                    shapeOf(p.steps) +
                    "</div>" +
                    '<div class="row-num">' +
                    (p.installs ? num(p.installs) : "—") +
                    "<span>" +
                    (p.installs ? "installs" : "not listed") +
                    "</span></div>" +
                    "</button>",
                )
                .join("")
            : '<div class="empty">No pipeline matches that.</div>') +
          "</div>";

        const qi = document.getElementById("q");
        qi.addEventListener("input", (e) => {
          filter.q = e.target.value;
          const at = e.target.selectionStart;
          renderRegistry();
          const next = document.getElementById("q");
          next.focus();
          next.setSelectionRange(at, at);
        });
        view.querySelectorAll(".chip").forEach((c) =>
          c.addEventListener("click", () => {
            filter.tag = c.dataset.tag;
            renderRegistry();
          }),
        );
        view.querySelectorAll(".row").forEach((r) =>
          r.addEventListener("click", () => {
            location.hash = "#/p/" + r.dataset.id;
          }),
        );
      }

      // ── Capability block, shared by detail and check ────────────────────────

      function verdictBlock(a) {
        const map = {
          allow: [
            "verdict-allow",
            "Safe to install",
            "Reads pages and writes a file. Nothing here reaches your accounts or sends data anywhere.",
          ],
          review: [
            "verdict-review",
            "Read this before installing",
            "This pipeline can do things worth knowing about. None of them are refused — but you should agree to them deliberately.",
          ],
          blocked: [
            "verdict-blocked",
            "Refused — not installable",
            a.blockedReason || "",
          ],
        };
        const [cls, title, body] = map[a.verdict];
        return (
          '<div class="verdict ' +
          cls +
          '">' +
          '<div class="verdict-title">' +
          title +
          "</div>" +
          "<p>" +
          esc(body) +
          "</p></div>"
        );
      }

      function capsBlock(a) {
        if (!a.capabilities.length)
          return '<p class="prose">Nothing beyond reading the page.</p>';
        return (
          '<div class="caps">' +
          a.capabilities
            .map(
              (c) =>
                '<div class="cap cap-' +
                c.severity +
                '">' +
                '<div class="cap-rule"></div><div>' +
                '<div class="cap-title">' +
                esc(c.title) +
                "</div>" +
                '<div class="cap-detail">' +
                esc(c.detail) +
                "</div>" +
                "</div></div>",
            )
            .join("") +
          "</div>"
        );
      }

      function stepsBlock(steps, depth = 0) {
        return (
          '<div class="steps">' +
          steps
            .map((s, i) => {
              const kids = s.children || [];
              const sub =
                s.config?.url ||
                s.config?.selector ||
                (s.config?.fields
                  ? s.config.fields.map((f) => f.name).join(", ")
                  : "") ||
                s.config?.schema ||
                s.config?.format ||
                "";
              return (
                '<div class="step" style="--stepc:' +
                catColor(s.type) +
                '">' +
                '<div class="step-idx">' +
                (depth ? "" : i + 1) +
                "</div>" +
                '<div class="step-bar"></div>' +
                '<div><div class="step-name">' +
                esc(nameOf(s.type)) +
                "</div>" +
                (sub ? '<div class="step-sub">' + esc(sub) + "</div>" : "") +
                "</div></div>" +
                (kids.length
                  ? '<div class="step-kids">' +
                    stepsBlock(kids, depth + 1) +
                    "</div>"
                  : "")
              );
            })
            .join("") +
          "</div>"
        );
      }

      // ── Pipeline detail ─────────────────────────────────────────────────────

      function renderDetail(id) {
        const p = REGISTRY.find((x) => x.id === id);
        if (!p) return renderRegistry();
        const a = p.analysis;
        const blocked = a.verdict === VERDICT.BLOCKED;

        view.innerHTML =
          '<div class="head">' +
          '<button class="back" data-back>← Registry</button>' +
          '<div class="eyebrow">' +
          p.id +
          " · by " +
          esc(p.author) +
          " · updated " +
          esc(p.updated) +
          "</div>" +
          "<h1>" +
          esc(p.name) +
          "</h1>" +
          '<p class="lede">' +
          esc(p.desc) +
          "</p>" +
          "</div>" +
          '<div class="split"><div class="stack">' +
          "<div><h2>What it does, step by step</h2>" +
          stepsBlock(p.steps) +
          "</div>" +
          "<div><h2>Pipeline JSON</h2><pre>" +
          esc(
            JSON.stringify(
              { name: p.name, targetOrigin: p.targetOrigin, steps: p.steps },
              null,
              2,
            ),
          ) +
          "</pre></div>" +
          "</div>" +
          '<div class="stack">' +
          '<div class="panel"><div class="panel-head">Capability review</div>' +
          '<div class="panel-body">' +
          verdictBlock(a) +
          capsBlock(a) +
          (blocked
            ? ""
            : '<button class="btn btn-primary" data-install>Install to extension</button>') +
          "</div></div>" +
          '<div class="panel"><div class="panel-head">Details</div><div class="panel-body">' +
          '<dl class="stack-sm">' +
          '<div class="kv"><dt>Part</dt><dd>' +
          p.id +
          "</dd></div>" +
          '<div class="kv"><dt>Steps</dt><dd>' +
          countSteps(p.steps) +
          "</dd></div>" +
          '<div class="kv"><dt>Installs</dt><dd>' +
          (p.installs ? num(p.installs) : "not listed") +
          "</dd></div>" +
          '<div class="kv"><dt>Scrapes</dt><dd>' +
          esc(a.declaredOrigins.join(", ") || "—") +
          "</dd></div>" +
          (a.thirdPartyOrigins.length
            ? '<div class="kv"><dt>Also contacts</dt><dd style="color:var(--red)">' +
              esc(a.thirdPartyOrigins.join(", ")) +
              "</dd></div>"
            : "") +
          '<div class="kv"><dt>Licence</dt><dd>MIT</dd></div>' +
          "</dl></div></div>" +
          "</div></div>";

        view.querySelector("[data-back]").addEventListener("click", () => {
          location.hash = "#/registry";
        });
        const inst = view.querySelector("[data-install]");
        if (inst)
          inst.addEventListener("click", () => {
            inst.textContent = "Opened in extension";
            inst.disabled = true;
          });
      }

      // ── Check a pipeline ────────────────────────────────────────────────────

      const SAMPLE = JSON.stringify(
        {
          name: "Marketplace scraper PRO (free!)",
          targetOrigin: "https://market.example.com",
          steps: [
            {
              id: "1",
              type: "WEBSITE",
              config: { url: "https://market.example.com/listings" },
            },
            {
              id: "2",
              type: "SESSION",
              config: { mode: "save", name: "s", includeCookies: true },
            },
            {
              id: "3",
              type: "EXTRACT",
              config: { fields: [{ name: "title" }] },
            },
            {
              id: "4",
              type: "API",
              config: {
                url: "https://analytics.deals4u-cdn.test/collect",
                method: "POST",
              },
            },
          ],
        },
        null,
        2,
      );

      function renderCheck() {
        view.innerHTML =
          '<div class="head">' +
          '<div class="eyebrow">Paste and check</div>' +
          "<h1>Paste a pipeline.<br />See what it <em>can do to you</em>.</h1>" +
          '<p class="lede">Somebody sent you a pipeline in a chat and you are about to run it against ' +
          "pages you are logged into. Paste it here first. This runs entirely in your browser — " +
          "nothing is uploaded, and the box is pre-filled with a real refusal so you can see what " +
          "one looks like.</p></div>" +
          '<div class="split">' +
          "<div><h2>Pipeline JSON</h2>" +
          '<textarea class="code" id="paste" spellcheck="false">' +
          esc(SAMPLE) +
          "</textarea>" +
          '<div class="rowflex" style="margin-top:12px">' +
          '<button class="btn btn-primary" id="run-check">Check it</button>' +
          '<button class="btn" id="clear-check">Clear</button>' +
          "</div></div>" +
          '<div class="stack" id="check-out"></div>' +
          "</div>";

        const ta = document.getElementById("paste");
        const out = document.getElementById("check-out");

        const run = () => {
          let parsed;
          try {
            parsed = JSON.parse(ta.value);
          } catch (e) {
            out.innerHTML =
              '<div class="panel"><div class="panel-head">Result</div>' +
              '<div class="panel-body"><div class="verdict verdict-blocked">' +
              '<div class="verdict-title">Not valid JSON</div>' +
              "<p>" +
              esc(e.message) +
              "</p></div></div></div>";
            return;
          }
          const a = analyzePipeline(parsed);
          out.innerHTML =
            '<div class="panel"><div class="panel-head">Capability review</div>' +
            '<div class="panel-body">' +
            verdictBlock(a) +
            capsBlock(a) +
            "</div></div>" +
            '<div class="panel"><div class="panel-head">Origins</div><div class="panel-body">' +
            '<dl class="stack-sm">' +
            '<div class="kv"><dt>Says it scrapes</dt><dd>' +
            esc(a.declaredOrigins.join(", ") || "nothing declared") +
            "</dd></div>" +
            '<div class="kv"><dt>Also contacts</dt><dd style="color:' +
            (a.thirdPartyOrigins.length ? "var(--red)" : "var(--muted)") +
            '">' +
            esc(a.thirdPartyOrigins.join(", ") || "nowhere else") +
            "</dd></div>" +
            '<div class="kv"><dt>Steps</dt><dd>' +
            walkSteps(parsed?.steps).length +
            "</dd></div>" +
            "</dl></div></div>";
        };

        document.getElementById("run-check").addEventListener("click", run);
        document.getElementById("clear-check").addEventListener("click", () => {
          ta.value = "";
          out.innerHTML = "";
          ta.focus();
        });
        run();
      }

      // ── Forum ───────────────────────────────────────────────────────────────

      function renderForum() {
        view.innerHTML =
          '<div class="head">' +
          '<div class="eyebrow">Forum</div>' +
          "<h1>Sites change.<br />That is the <em>whole job</em>.</h1>" +
          '<p class="lede">A scraper breaks because somebody renamed a class, not because you wrote it ' +
          "wrong. Site reports are first-class here: when a pipeline in the registry stops working, " +
          "it gets flagged on its listing so the next person does not lose an afternoon to it.</p></div>" +
          '<div class="rows">' +
          THREADS.map(
            (t) =>
              '<button class="thread" data-id="' +
              t.id +
              '">' +
              '<div class="thread-cat ' +
              t.catClass +
              '">' +
              esc(t.cat) +
              "</div>" +
              "<div>" +
              '<div class="thread-title">' +
              esc(t.title) +
              (t.solved ? '<span class="badge b-verified">Solved</span>' : "") +
              (t.affects
                ? '<span class="badge b-plain">' + t.affects + "</span>"
                : "") +
              "</div>" +
              '<div class="thread-meta">' +
              esc(t.by) +
              " · " +
              esc(t.when) +
              "</div>" +
              "</div>" +
              '<div class="thread-count">' +
              t.replies +
              "<span>replies</span></div>" +
              "</button>",
          ).join("") +
          "</div>";

        view.querySelectorAll(".thread").forEach((el) =>
          el.addEventListener("click", () => {
            location.hash = "#/t/" + el.dataset.id;
          }),
        );
      }

      function renderThread(id) {
        const t = THREADS.find((x) => x.id === id);
        if (!t) return renderForum();
        view.innerHTML =
          '<div class="head">' +
          '<button class="back" data-back>← Forum</button>' +
          '<div class="eyebrow">' +
          esc(t.cat) +
          " · " +
          t.replies +
          " replies" +
          (t.affects ? " · affects " + t.affects : "") +
          "</div>" +
          "<h1>" +
          esc(t.title) +
          "</h1></div>" +
          '<div class="stack-sm" style="max-width:860px">' +
          t.posts
            .map(
              (p) =>
                '<article class="post' +
                (p.answer ? " answer" : "") +
                '">' +
                '<div class="post-by"><b>' +
                esc(p.by) +
                "</b><span>" +
                esc(p.when) +
                "</span></div>" +
                '<div class="post-body">' +
                p.body +
                "</div></article>",
            )
            .join("") +
          "</div>";
        view.querySelector("[data-back]").addEventListener("click", () => {
          location.hash = "#/forum";
        });
      }

      // ── Publish ─────────────────────────────────────────────────────────────

      function renderSubmit() {
        view.innerHTML =
          '<div class="head">' +
          '<div class="eyebrow">Publish</div>' +
          "<h1>Publishing is<br />a <em>pull request</em>.</h1>" +
          '<p class="lede">There is no upload form and no account, because there is no server holding ' +
          "your pipelines. A listing is a JSON file in a public repository, and publishing one is a " +
          "pull request against it — which means every entry has a diff, an author and a review you " +
          "can read.</p></div>" +
          '<div class="split"><div class="stack">' +
          "<div><h2>How it works</h2>" +
          '<div class="steps">' +
          [
            [
              "Save JSON",
              "In the side panel, Save JSON on the pipeline you want to share.",
            ],
            [
              "Check it",
              "Run it through the checker here. If it is refused, it will not be merged — you will see why now rather than in review.",
            ],
            [
              "Open a pull request",
              "Add the file under registry/ with a name, a one-line description and the site it targets.",
            ],
            [
              "Automatic review",
              "The same capability check runs in CI. A refused pipeline fails the build.",
            ],
            [
              "Human review",
              "A maintainer reads the diff. Small registry, real review.",
            ],
          ]
            .map(
              (s, i) =>
                '<div class="step" style="--stepc:var(--cat-flow)">' +
                '<div class="step-idx">' +
                (i + 1) +
                "</div>" +
                '<div class="step-bar"></div>' +
                '<div><div class="step-name">' +
                s[0] +
                "</div>" +
                '<div class="step-sub">' +
                s[1] +
                "</div></div></div>",
            )
            .join("") +
          "</div></div>" +
          "<div><h2>What gets a pipeline refused</h2>" +
          '<p class="prose">One rule, applied by machine and not negotiable: a pipeline that both reads ' +
          "credentials and sends requests to a site it never said it scrapes. That pairing has no " +
          "innocent version. Everything else — cookies alone, third-party APIs alone, AI extraction, " +
          "uploads — is listed with a warning and left to the person installing it.</p></div>" +
          "</div>" +
          '<div class="panel"><div class="panel-head">Listing format</div>' +
          '<div class="panel-body"><pre>' +
          esc(
            JSON.stringify(
              {
                id: "FS-0500",
                name: "Your pipeline",
                author: "your-handle",
                desc: "One line. What it does and where it works.",
                targetOrigin: "https://example.com",
                steps: ["… exported from the side panel …"],
              },
              null,
              2,
            ),
          ) +
          "</pre></div></div></div>";
      }

      // ── Router ──────────────────────────────────────────────────────────────

      function route() {
        const h = location.hash || "#/registry";
        const parts = h.replace(/^#\//, "").split("/");
        const at = parts[0] || "registry";

        if (at === "p") renderDetail(parts[1]);
        else if (at === "t") renderThread(parts[1]);
        else if (at === "check") renderCheck();
        else if (at === "forum") renderForum();
        else if (at === "submit") renderSubmit();
        else renderRegistry();

        const active =
          at === "p" ? "registry" : at === "t" ? "forum" : at || "registry";
        document.querySelectorAll("#nav a").forEach((a) => {
          a.classList.toggle("on", a.dataset.route === active);
        });
        window.scrollTo(0, 0);
      }

      window.addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
